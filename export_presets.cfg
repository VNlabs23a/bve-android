[preset.0]

name="Android Debug"
platform="Android"
runnable=true
dedicated_server=false
custom_template_release=""
custom_template_debug=""

export_filter="all_resources"
export_path="build/OpenBVE-Android-Debug.apk"

include_filter=""
exclude_filter=""

encrypt_pck=false
encryption_key=""

custom_features=""

[preset.0.options]
custom_template/debug=""
custom_template/release=""

# icons/vulkan="res://assets/icons/icon.png"
# icons/adaptive="res://assets/icons/icon_adaptive.xml"

permissions/internet=true
permissions/access_network_state=true
permissions/wake_lock=true
permissions/foreground_service=true
permissions/read_external_storage=true
permissions/write_external_storage=true
permissions/record_audio=true
permissions/vibrate=true

config/min_sdk=24
config/target_sdk=34
config/version_code=1
config/version_name="1.0.0"
config/package="com.openbve.android"
config/orientation="sensorLandscape"
config/screen_orientation="landscape"
config/main_activity="com.godot.game.GodotActivity"
config/use_obb=false
config/obb_custom_path=""

arch/arm64=true
arch/armv7=true
arch/x86=false
arch/x86_64=false

debug/server_address=""
debug/remote_debug=false
debug/dump_on_fatal=false

graphics/rendering_method="mobile"
graphics/vram_compression="astc"
graphics/gles3_required=true
graphics/vulkan_required=false

