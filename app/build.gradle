plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.openbve.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.openbve.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Godot requires these
        ndkVersion "26.1.10909125"

        // Multi-dex for large method count
        multiDexEnabled true

        // Vector drawables
        vectorDrawables.useSupportLibrary = true

        // Test instrumentation
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }

        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        // Play Store bundle
        bundle {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Packaging options for native libraries
    packagingOptions {
        pickFirst 'lib/**/*.so'
        pickFirst 'lib/arm64-v8a/**/*.so'
        pickFirst 'lib/armeabi-v7a/**/*.so'
        pickFirst 'lib/x86/**/*.so'
        pickFirst 'lib/x86_64/**/*.so'

        // Exclude duplicate META-INF files
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/proguard/**'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
    }

    // Splits for APK size optimization
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    // Bundle configuration for Play Store
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Godot dependencies (provided by export template)
    implementation files('libs/godot-lib.<variant>.release.aar')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Godot-specific tasks
tasks.withType(com.android.build.gradle.tasks.MergeResources) {
    doLast {
        // Ensure Godot's assets are included
    }
}

// Signing configs (defined in gradle.properties or local.properties)
signingConfigs {
    debug {
        storeFile file('debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }

    release {
        if (project.hasProperty('RELEASE_STORE_FILE')) {
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }
}