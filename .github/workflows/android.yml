name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release/aab require keystore secrets)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - aab
          - all

env:
  GODOT_VERSION: '4.3'
  GODOT_CHANNEL: 'stable'
  PROJECT_PATH: '.'
  ANDROID_SDK_ROOT: '/opt/android-sdk'
  ANDROID_NDK_VERSION: '27.0.12077973'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_SDK_ROOT/licenses" && echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license" && echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license" || true
          ./latest/bin/sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_PATH

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la "$ANDROID_HOME"/platforms/ || true
          ls -la "$ANDROID_NDK_HOME"/toolchains/ || true
          sdkmanager --list | head -30

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-${{ runner.os }}
          restore-keys: |
            godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          cd ~/.local/bin
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64.zip"
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64 godot
          chmod +x godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          cd ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz"
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz
          mv templates/* .
          rm -rf templates Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build C# project
        run: |
          cd "${{ env.PROJECT_PATH }}"
          dotnet build OpenBVE-Android.csproj -c Release

      - name: Verify project and import resources
        run: |
          cd "${{ env.PROJECT_PATH }}"
          godot --headless --version
          godot --headless --path . --check-only
          godot --headless --path . --import

      - name: Export Debug APK
        run: |
          cd "${{ env.PROJECT_PATH }}"
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" "build/OpenBVE-Android-Debug.apk"

      - name: Verify output
        run: |
          ls -la "${{ env.PROJECT_PATH }}/build/"
          if [ ! -f "${{ env.PROJECT_PATH }}/build/OpenBVE-Android-Debug.apk" ]; then
            echo "ERROR: Debug APK not found!"
            exit 1
          fi
          file "${{ env.PROJECT_PATH }}/build/OpenBVE-Android-Debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenBVE-Android-Debug
          path: ${{ env.PROJECT_PATH }}/build/OpenBVE-Android-Debug.apk
          retention-days: 30
          if-no-files-found: error

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_SDK_ROOT/licenses" && echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license" && echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license" || true
          ./latest/bin/sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_PATH

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la "$ANDROID_HOME"/platforms/ || true
          ls -la "$ANDROID_NDK_HOME"/toolchains/ || true
          sdkmanager --list | head -30

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-${{ runner.os }}
          restore-keys: |
            godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          cd ~/.local/bin
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64.zip"
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64 godot
          chmod +x godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          cd ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz"
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz
          mv templates/* .
          rm -rf templates Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build C# project
        run: |
          cd "${{ env.PROJECT_PATH }}"
          dotnet build OpenBVE-Android.csproj -c Release

      - name: Verify project and import resources
        run: |
          cd "${{ env.PROJECT_PATH }}"
          godot --headless --version
          godot --headless --path . --check-only
          godot --headless --path . --import

      - name: Configure Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "keystore/path=release.keystore" >> $GITHUB_ENV
          echo "keystore/password=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "keystore/key_password=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "keystore/alias=${{ secrets.KEYSTORE_ALIAS }}" >> $GITHUB_ENV

      - name: Export Release APK
        run: |
          cd "${{ env.PROJECT_PATH }}"
          mkdir -p build
          if [ -f "release.keystore" ]; then
            godot --headless --path . --export-release "Android Release" "build/OpenBVE-Android-Release.apk" \
              --keystore release.keystore \
              --keystore-password "${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-password "${{ secrets.KEYSTORE_KEY_PASSWORD }}" \
              --alias "${{ secrets.KEYSTORE_ALIAS }}"
          else
            echo "WARNING: No keystore configured, building unsigned release APK"
            godot --headless --path . --export-release "Android Release" "build/OpenBVE-Android-Release.apk"
          fi

      - name: Verify output
        run: |
          ls -la "${{ env.PROJECT_PATH }}/build/"
          if [ ! -f "${{ env.PROJECT_PATH }}/build/OpenBVE-Android-Release.apk" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi
          file "${{ env.PROJECT_PATH }}/build/OpenBVE-Android-Release.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenBVE-Android-Release
          path: ${{ env.PROJECT_PATH }}/build/OpenBVE-Android-Release.apk
          retention-days: 30
          if-no-files-found: error

  build-aab:
    name: Build AAB (Play Store)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'all')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_SDK_ROOT/licenses" && echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license" && echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license" || true
          ./latest/bin/sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_PATH

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la "$ANDROID_HOME"/platforms/ || true
          ls -la "$ANDROID_NDK_HOME"/toolchains/ || true
          sdkmanager --list | head -30

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-${{ runner.os }}
          restore-keys: |
            godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          cd ~/.local/bin
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64.zip"
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64 godot
          chmod +x godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          cd ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz"
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz
          mv templates/* .
          rm -rf templates Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build C# project
        run: |
          cd "${{ env.PROJECT_PATH }}"
          dotnet build OpenBVE-Android.csproj -c Release

      - name: Verify project and import resources
        run: |
          cd "${{ env.PROJECT_PATH }}"
          godot --headless --version
          godot --headless --path . --check-only
          godot --headless --path . --import

      - name: Configure Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "keystore/path=release.keystore" >> $GITHUB_ENV
          echo "keystore/password=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "keystore/key_password=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "keystore/alias=${{ secrets.KEYSTORE_ALIAS }}" >> $GITHUB_ENV

      - name: Export AAB
        run: |
          cd "${{ env.PROJECT_PATH }}"
          mkdir -p build
          if [ -f "release.keystore" ]; then
            godot --headless --path . --export-release "Android AAB (Play Store)" "build/OpenBVE-Android.aab" \
              --keystore release.keystore \
              --keystore-password "${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-password "${{ secrets.KEYSTORE_KEY_PASSWORD }}" \
              --alias "${{ secrets.KEYSTORE_ALIAS }}"
          else
            echo "WARNING: No keystore configured, building unsigned AAB"
            godot --headless --path . --export-release "Android AAB (Play Store)" "build/OpenBVE-Android.aab"
          fi

      - name: Verify output
        run: |
          ls -la "${{ env.PROJECT_PATH }}/build/"
          if [ ! -f "${{ env.PROJECT_PATH }}/build/OpenBVE-Android.aab" ]; then
            echo "ERROR: AAB not found!"
            exit 1
          fi
          file "${{ env.PROJECT_PATH }}/build/OpenBVE-Android.aab"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: OpenBVE-Android-AAB
          path: ${{ env.PROJECT_PATH }}/build/OpenBVE-Android.aab
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-release, build-aab]
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: OpenBVE-Android-Release
          path: artifacts/release

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: OpenBVE-Android-AAB
          path: artifacts/aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/OpenBVE-Android-Release.apk
            artifacts/aab/OpenBVE-Android.aab
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}