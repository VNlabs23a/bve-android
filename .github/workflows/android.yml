name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - aab
          - all

env:
  GODOT_VERSION: '4.3'
  GODOT_CHANNEL: 'stable'
  GODOT_EXPORT_TEMPLATES_VERSION: '4.3.stable'
  PROJECT_PATH: '.'
  EXPORT_NAME_DEBUG: 'Android Debug'
  EXPORT_NAME_RELEASE: 'Android Release'
  EXPORT_NAME_AAB: 'Android AAB (Play Store)'

jobs:
  build:
    name: Build ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: debug
            export_name: 'Android Debug'
            output_name: 'OpenBVE-Android-Debug.apk'
            artifact_name: 'OpenBVE-Android-Debug'
          - build_type: release
            export_name: 'Android Release'
            output_name: 'OpenBVE-Android-Release.apk'
            artifact_name: 'OpenBVE-Android-Release'
          - build_type: aab
            export_name: 'Android AAB (Play Store)'
            output_name: 'OpenBVE-Android.aab'
            artifact_name: 'OpenBVE-Android-AAB'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: '26.1.10909125'
          build-tools: '34.0.0'
          cmdline-tools: 'latest'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-${{ runner.os }}
          restore-keys: |
            godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          cd ~/.local/bin
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64.zip"
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_linux.x86_64 godot
          chmod +x godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          cd ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz"
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz
          mv templates/* .
          rm -rf templates Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}_export_templates.tpz

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify project
        run: |
          godot --headless --version
          godot --headless --path "${{ env.PROJECT_PATH }}" --check-only

      - name: Build C# project
        run: |
          cd "${{ env.PROJECT_PATH }}"
          dotnet build OpenBVE-Android.csproj -c Release

      - name: Export ${{ matrix.build_type }}
        run: |
          cd "${{ env.PROJECT_PATH }}"
          mkdir -p build
          if [ "${{ matrix.build_type }}" = "debug" ]; then
            godot --headless --path . --export-debug "${{ matrix.export_name }}" "build/${{ matrix.output_name }}"
          else
            godot --headless --path . --export-release "${{ matrix.export_name }}" "build/${{ matrix.output_name }}"
          fi

      - name: Verify output
        run: |
          ls -la "${{ env.PROJECT_PATH }}/build/"
          if [ ! -f "${{ env.PROJECT_PATH }}/build/${{ matrix.output_name }}" ]; then
            echo "ERROR: Build output not found!"
            exit 1
          fi
          file "${{ env.PROJECT_PATH }}/build/${{ matrix.output_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.PROJECT_PATH }}/build/${{ matrix.output_name }}
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/') && matrix.build_type != 'debug'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_PATH }}/build/${{ matrix.output_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  # Build all variants on manual dispatch
  build-all:
    name: Build All Variants
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

